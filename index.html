<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文明5 超级大国模组</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
      <h1>文明5 · 超级大国 模组</h1>
      <p>重塑现代霸权，体验全球文明巅峰对决！</p>
      <a href="#join" class="cta-button">立即加入群聊</a>
    </div>
  </header>

  <section id="features" class="features">
    <h2>模组亮点</h2>
    <div class="cards">
      <div class="card">
        <h3>超强科技树</h3>
        <p>新增未来科技，体验从冷战到太空时代的演进。</p>
      </div>
      <div class="card">
        <h3>现代军备系统</h3>
        <p>导弹、无人机、核武器，让战争更具策略与张力。</p>
      </div>
      <div class="card">
        <h3>全球对抗机制</h3>
        <p>联盟、制裁、情报战，一切由你主宰。</p>
      </div>
    </div>
  </section>

  <section id="join" class="join">
    <h2>加入官方群聊</h2>
    <p>获取模组下载、攻略分享、实时交流</p>
    <div class="join-content">
      <img src="qrcode.png" alt="QQ群聊二维码">
      <button class="cta-button" onclick="copyGroupLink()">复制加群链接</button>
    </div>
  </section>

  <footer>
    <p>© 2025 超级大国模组团队</p>
  </footer>

  <script src="script.js"></script>
</body>
